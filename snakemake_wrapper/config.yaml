# =============================================================================
# CloneCatcher Configuration
#
# Generated by `python cli/create_config.py`. Edit by hand freely; the CLI only
# writes this file, it does not read it back.
#
# output_dir is the project working directory. Nothing is written into the
# CloneCatcher repository itself.
# =============================================================================

output_dir: "/master/jlehle/WORKING/SC/fastq/OPSSC/GSE226620_clonecatcher"
input_mode: "single_cell"          # single_cell | bulk
threads: 16
memory_gb: 32
resources_dir: "resources"

# =============================================================================
# single_cell mode
# =============================================================================

# Upstream ClusterCatcher run. sample_id and the barcode namespace are read
# from its AnnData, not re-derived from accessions or directory names.
clustercatcher_run_dir: "/master/jlehle/WORKING/SC/fastq/OPSSC/GSE226620"

# CellRanger output root holding the multi runs. Usually the same tree as the
# ClusterCatcher run; kept separate so a relocated CellRanger directory does
# not require moving the AnnData.
cellranger_dir: "/master/jlehle/WORKING/SC/fastq/OPSSC/GSE226620/cellranger"

# Leave null to read samples from the ClusterCatcher AnnData. Set a list only
# to restrict the run to a subset.
samples: null

barcode:
  # Floor for the VDJ-to-GEX join. Measure it with `inspect-barcodes` on a real
  # sample and pin just below the observed rate. Below this the run raises
  # rather than proceeding on a partial join.
  min_join_rate: 0.40
  # drop  -- VDJ cells absent from GEX are dropped with a logged count
  # raise -- any unmapped VDJ cell halts the run
  on_unmapped: "drop"

vdj:
  require_productive: true
  require_paired: false            # keep orphan chains, flagged is_paired=false
  min_umis: 2

# =============================================================================
# bulk mode
#
# Uncomment this block and set input_mode: bulk. clustercatcher_run_dir,
# cellranger_dir, barcode, and vdj are all ignored in bulk mode.
# =============================================================================

# sample_info: "/path/to/samples.pkl"
#
# trust4:
#   imgt_reference: "resources/IMGT+C.fa"
#   min_abundance: 2
#   chains: ["TRA", "TRB"]

# =============================================================================
# Shared backend
# =============================================================================

repertoire:
  diversity_methods: ["chao1", "shannon", "gini"]
  top_n_clones: 20

expansion:
  # null  -- per-sample expanded-clone calls and clonality, no hypothesis test.
  #          This is what a tumor dataset with no experimental arms supports.
  # set   -- beta-binomial differential test between conditions, blocked.
  contrast: null
  #
  # contrast:
  #   group_col: "condition"
  #   test: "mutant"
  #   reference: "wildtype"
  #   exclude: "empty_vector"      # alloreactive clones removed before testing
  #   block_col: "donor"
  #
  fdr: 0.05
  expansion_threshold: 0.01        # within-sample frequency defining expansion

specificity:
  method: "tcrdist3"
  radius: 50
  reference_dbs: ["vdjdb", "mcpas"]

# =============================================================================
# Module toggles
# =============================================================================

modules:
  repertoire: true
  expansion: true
  specificity: true
  integration: true                # single_cell only; ignored in bulk mode
