name: CloneCatcher-scrna
channels:
  - conda-forge
  - bioconda
dependencies:
  # ===========================================
  # Core Python
  # ===========================================
  - python>=3.9,<3.12
  - pip
  - setuptools<78

  # ===========================================
  # Pipeline Management
  # ===========================================
  - snakemake>=7.0
  - mamba
  - conda

  # ===========================================
  # CLI and Configuration
  # ===========================================
  - click>=8.0
  - pyyaml
  - rich  # For nice CLI output
  - coincbc

  # ===========================================
  # Data Handling
  # ===========================================
  # Pinned to match ClusterCatcher. These are not free choices: CloneCatcher
  # reads h5ad objects written by ClusterCatcher, so anndata in particular
  # must not lag behind the version that wrote them.
  - pandas=2.2.3
  - numpy=1.26.4
  - scipy>=1.7
  - h5py
  - hdf5
  - tqdm
  - pyarrow

  # ===========================================
  # Single-Cell Analysis (Scanpy Ecosystem)
  # ===========================================
  - scanpy>=1.9
  - anndata=0.12.6  # Must match ClusterCatcher
  - leidenalg
  - python-igraph

  # ===========================================
  # Bioinformatics Core Tools
  # ===========================================
  - samtools>=1.15
  - pysam>=0.19

  # ===========================================
  # Repertoire Statistics (Immunarch)
  # ===========================================
  - r-base>=4.2
  - r-immunarch>=0.9
  - r-dplyr
  - r-ggplot2
  - r-readr
  - r-jsonlite
  - rpy2>=3.4

  # ===========================================
  # Visualization
  # ===========================================
  - matplotlib-base>=3.5
  - seaborn>=0.11
  - adjusttext
  - plotly  # For interactive plots

  # ===========================================
  # Machine Learning / Statistics
  # ===========================================
  - scikit-learn>=1.0
  - statsmodels  # Beta-binomial expansion test

  # ===========================================
  # Additional Utilities
  # ===========================================
  - biopython
  - regex
  - multiqc  # For QC reports

  # ===========================================
  # Pip Packages
  # ===========================================
  - pip:
    - fishersapi

# ===========================================
# Notes
# ===========================================
# tcrdist3 is deliberately NOT in this environment. It does not support
# pandas 2.x, and pandas is pinned to 2.2.3 here to match ClusterCatcher's
# anndata 0.12.6. The specificity stage runs in envs/tcrdist3.yaml instead.
# This is the only stage that crosses an environment boundary.
#
# No Cell Ranger. VDJ assembly happens upstream in ClusterCatcher's
# cellranger multi step; this mode reads its output.
#
# Upstream requirement: a completed ClusterCatcher run over the same samples,
# and a cellranger multi run whose config declares a VDJ-T library. A sample
# whose multi config lists only Gene Expression produces no vdj_t output and
# cannot be analyzed in this mode.
