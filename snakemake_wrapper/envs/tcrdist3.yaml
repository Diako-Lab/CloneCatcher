name: CloneCatcher-tcrdist3
channels:
  - conda-forge
  - bioconda
dependencies:
  # ===========================================
  # Core Python
  # ===========================================
  - python=3.10
  - pip
  - setuptools<78

  # ===========================================
  # Data Handling
  # ===========================================
  # These pins are the whole reason this environment exists. tcrdist3 does
  # not support pandas 2.x, while bulk.yaml and scrna.yaml both pin
  # pandas 2.2.3 to match ClusterCatcher. The two cannot coexist, so the
  # specificity stage is isolated here and exchanges data with the rest of
  # the pipeline through TSV files rather than in-memory objects.
  - pandas=1.5.*
  - numpy=1.23.*
  - scipy=1.10.*
  - pyyaml
  - tqdm

  # ===========================================
  # Visualization
  # ===========================================
  - matplotlib-base>=3.5
  - seaborn>=0.11

  # ===========================================
  # Pip Packages
  # ===========================================
  - pip:
    # Specificity clustering
    - tcrdist3==0.2.2
    - parasail==1.3.4
    - fishersapi

# ===========================================
# Notes
# ===========================================
# Used by exactly one rule: tcrdist_cluster. Its inputs and outputs are both
# TSV, so nothing pickled or h5ad-shaped crosses this boundary and the version
# skew stays contained.
#
# If a tcrdist3 release adds pandas 2.x support, fold this back into
# bulk.yaml and scrna.yaml and delete this file. Check before assuming it is
# still needed:
#     pip index versions tcrdist3
#
# Reference databases (VDJdb, McPAS-TCR) are fetched separately:
#     CloneCatcher fetch-databases --output-dir resources/
